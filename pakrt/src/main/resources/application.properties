spring.application.name=pakrt

# Konfigurasi Database (Wajib dimuat dari Environment Variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# Konfigurasi JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Konfigurasi Keamanan Kustom
app.security.secret-key=${ENCRYPTION_KEY}

# Konfigurasi JWT
app.jwt.secret-key=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:600000}

# Konfigurasi Port Server
server.port=${SERVER_PORT:8081}